name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  HEXCORE_LIVE: "0"
  HEXCORE_LIVE_WRITES: "0"

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Formatting and module checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Test release automation offline
        run: node --test .github/scripts/*.test.mjs

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            echo '::error::Run go fmt ./... and commit the formatting changes.'
            exit 1
          fi

      - name: Check module files
        run: |
          go mod tidy
          changes="$(git status --porcelain -- go.mod go.sum)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            echo '::error::Run go mod tidy with stable Go and commit the module files.'
            exit 1
          fi
          go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  tests:
    name: Go stable (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.mod

      - name: Validate workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run offline tests
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out -json ./... | tee test-results.json

      - name: Upload test results
        if: ${{ !cancelled() && hashFiles('test-results.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-linux-stable
          path: test-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Summarize coverage
        run: |
          go tool cover -func=coverage.out > coverage.txt
          {
            echo '## Statement coverage'
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error
          retention-days: 7

  pr-policy:
    name: PR branch and release policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Validate PR title, branch, and release metadata
        run: node .github/scripts/release-workflow.mjs check-pr

  docs:
    name: Documentation build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install documentation dependencies
        run: npm ci

      - name: Build documentation and check links
        run: npm run docs:build

      - name: Upload released documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/.vitepress/dist

  ci:
    name: CI
    if: ${{ always() }}
    needs: [quality, tests, pr-policy, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          POLICY_RESULT: ${{ needs.pr-policy.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$QUALITY_RESULT" == "success" ]]
          [[ "$TEST_RESULT" == "success" ]]
          [[ "$DOCS_RESULT" == "success" ]]
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$POLICY_RESULT" == "success" ]]
          else
            [[ "$POLICY_RESULT" == "skipped" ]]
          fi

  deploy-docs:
    name: Deploy released documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ci, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No checkout/rebuild: deploy only the artifact from this exact push CI run.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
