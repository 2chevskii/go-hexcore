name: Prepare release

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source branch: develop, or a master-based hotfix/name branch'
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: release-management
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Calculate version and create candidate PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source }}
        run: node .github/scripts/release-workflow.mjs prepare
